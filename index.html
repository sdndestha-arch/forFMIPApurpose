 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="flowers.png" type="image/x-icon">
    <title>Flowers</title>
</head>
<body>
    <div class="background-florals" aria-hidden="true">
        <span class="background-florals__sprig background-florals__sprig--left"><i></i><i></i><i></i><i></i><i></i><i></i></span>
        <span class="background-florals__sprig background-florals__sprig--right"><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <main class="gift-scene">
        <p class="description">PAKETTT atas nama kak Safa FMIPA UI YANG KEREN DAN CANTIK BANGET</p>
        <input class="envelope-toggle" id="envelopeToggle" type="checkbox">
        <label class="envelope" for="envelopeToggle" aria-label="Buka amplop hadiah">
            <span class="envelope__letter">BUKA AKU <br> BUKA AKU</span>
            <span class="envelope__sprig envelope__sprig--left" aria-hidden="true"><span class="envelope__sprig-flower">&#10047;</span><i></i><i></i></span>
            <span class="envelope__sprig envelope__sprig--right" aria-hidden="true"><span class="envelope__sprig-flower">&#10047;</span><i></i><i></i></span>
            <span class="envelope__front"></span>
            <span class="envelope__flap"></span>
            <span class="envelope__seal" aria-hidden="true">&#10047;</span>
        </label>
        <p class="surprise-message">Buka amplopnya...</p>
    </main>
    <audio id="sharedMusic" src="wave to earth - ride.mp3" preload="auto"></audio>
    <iframe class="flower-experience" id="flowerExperience" src="flower.html" title="Hadiah bunga dan musik" allow="autoplay" aria-hidden="true"></iframe>
    <script>
        const flowerExperience = document.querySelector("#flowerExperience");
        const sharedMusic = document.querySelector("#sharedMusic");
        sharedMusic.volume = 0.35;

        document.querySelector("#envelopeToggle").addEventListener("change", (event) => {
            if (event.target.checked) {
                document.querySelector(".surprise-message").textContent = "Kejutan untukmu...";
                sharedMusic.play().catch(() => {});
                window.setTimeout(() => {
                    document.body.classList.add("leaving");
                    window.setTimeout(() => {
                        document.querySelector(".gift-scene").hidden = true;
                        document.querySelector(".background-florals").hidden = true;
                        flowerExperience.setAttribute("aria-hidden", "false");
                        flowerExperience.classList.add("is-active");
                        document.body.classList.remove("leaving");
                    }, 700);
                }, 3000);
            }
        });
    </script>
</body>
</html>
